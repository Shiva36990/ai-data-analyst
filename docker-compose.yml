services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Uses the restricted read-only role created by init_db.sql --
      # NOT the postgres superuser. Change the password in both
      # init_db.sql and here before using this outside local dev.
      DATABASE_URL: postgresql+psycopg://ai_readonly:change_me_readonly@postgres:5432/ai_analytics
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      MAX_QUERY_ROWS: ${MAX_QUERY_ROWS:-500}
      SQL_TIMEOUT_MS: ${SQL_TIMEOUT_MS:-10000}
      MAX_SQL_RETRIES: ${MAX_SQL_RETRIES:-2}
      MAX_INVESTIGATION_STEPS: ${MAX_INVESTIGATION_STEPS:-2}

volumes:
  postgres_data:
